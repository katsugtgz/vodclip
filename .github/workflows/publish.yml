# Publishing driven by release tags: merge, tag vX.Y.Z, push. This picks it up.
#
# Uses npm trusted publishing: GitHub exchanges a short-lived OIDC token for
# publish rights. No NPM_TOKEN secret stored anywhere, and npm shows a
# provenance attestation on the package page.
#
# One-time setup, in this order:
#   1. The package must already exist on npm before a trusted publisher can be
#      attached (npm cannot create a package from a trusted-publisher claim), so
#      the very first version is published from a maintainer machine with 2FA:
#      `npm publish --access public`.
#   2. npmjs.com -> package settings -> Trusted Publisher -> point at this
#      repository, this workflow file (publish.yml) and the `npm` environment.
#   3. Optionally disallow token publishing so only this workflow can publish.
#
# Trusted publishing needs npm CLI 11.5.1 or later. Node 22 still ships npm 10,
# so the job upgrades npm before publishing.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC for npm trusted publishing
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: npm CLI for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          test "v${GITHUB_REF_NAME#v}" = "$pkg" || { echo "tag $GITHUB_REF_NAME != $pkg"; exit 1; }
      - run: npm publish --provenance
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
